  <style id="app-boot-style">
    html.app-booting { background: #f7f1e6; }
    html.app-booting body { visibility: hidden; }
  </style>
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("app-booting");
      var released = false;
      var themeReady = false;
      var hardTimeoutId = window.setTimeout(function () { release(true); }, 7000);
      function release(force) {
        if (released || (!themeReady && !force)) return;
        released = true;
        window.clearTimeout(hardTimeoutId);
        root.classList.remove("app-booting");
      }
      window.addEventListener("festival-theme-ready", function () {
        themeReady = true;
        release(false);
      }, { once: true });
    })();
  </script>
